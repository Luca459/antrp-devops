services:

  # ── Reverse Proxy ────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # ── Static Frontend ──────────────────────────────────────────
  frontend:
    build: .
    restart: unless-stopped

  # ── API Backend ──────────────────────────────────────────────
  backend:
    build: ./backend
    env_file: .env
    restart: unless-stopped
